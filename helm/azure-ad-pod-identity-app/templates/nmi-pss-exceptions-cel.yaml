{{- if .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ template "aad-pod-identity.nmi.fullname" . }}-exceptions
  namespace: kube-system
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
  - name: disallow-capabilities
    kind: ValidatingPolicy
  - name: disallow-host-namespaces
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-non-root-user
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  # restrict-seccomp-strict is missing from the legacy exception. It is excepted
  # because the MIC Deployment fails it.
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  # check-resources-request-and-limits-ratio is a supplemental policy and usually
  # not enabled. It is excepted because the MIC Deployment fails it when the
  # policy is enforced.
  - name: check-resources-request-and-limits-ratio
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the MIC Deployment fails it when the
  # policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-emptydir-requests-and-limits is a supplemental policy and usually not
  # enabled. It is excepted because the MIC Deployment fails it when the policy
  # is enforced.
  - name: require-emptydir-requests-and-limits
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the NMI DaemonSet and the MIC Deployment fail it when the
  # policy is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the NMI and MIC ServiceAccounts fail it when
  # the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: aad-pod-identity-workloads
    # The first block is the legacy match (NMI). ServiceAccount is matched for
    # restrict-sa-automount-sa-token. The second block matches the MIC
    # Deployment, its Pods and its ServiceAccount, which fail the policies above
    # but no legacy exception covers.
    expression: >-
      (request.kind.kind in ['DaemonSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ $.Release.Namespace }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ template "aad-pod-identity.nmi.fullname" . }}' || object.metadata.name.startsWith('{{ template "aad-pod-identity.nmi.fullname" . }}-'))) ||
      (request.kind.kind in ['Deployment', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ $.Release.Namespace }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ template "aad-pod-identity.mic.fullname" . }}' || object.metadata.name.startsWith('{{ template "aad-pod-identity.mic.fullname" . }}-')))
{{- end }}
